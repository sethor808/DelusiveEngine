name: Notify Discord on push

on:
  push:
    branches:
      - main

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Get commits
        run: |
          echo "COMMITS<<EOF" >> $GITHUB_ENV
          git log ${{ github.event.before }}..${{ github.sha }} --pretty=format:'**%h** - %an: %s%n<%H>' >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Send Discord notification
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"New commit(s) on **${GITHUB_REF#refs/heads/}**:\n$COMMITS\"}" \
               ${{ secrets.DISCORD_WEBHOOK_URL }}
