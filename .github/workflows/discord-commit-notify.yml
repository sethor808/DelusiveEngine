name: Notify Discord on push

on:
  push:
    branches:
      - main

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare commit info
        id: commit_info
        run: |
          # Count commits in this push
          push_count=$(jq '.commits | length' $GITHUB_EVENT_PATH)
          echo "push_count=$push_count" >> $GITHUB_OUTPUT

          # Count total commits in repo
          total_commits=$(git rev-list --count HEAD)
          echo "total_commits=$total_commits" >> $GITHUB_OUTPUT

          # Build commits summary (Title + Description)
          commits_summary=""
          for sha in $(jq -r '.commits[].id' $GITHUB_EVENT_PATH); do
            full_message=$(git log -1 --pretty=%B $sha)
            title=$(echo "$full_message" | head -n1)
            desc=$(echo "$full_message" | tail -n +2 | sed '/^\s*$/d')
            if [ -z "$desc" ]; then
              commits_summary+="- $title\n"
            else
              commits_summary+="- $title: $desc\n"
            fi
          done
          echo "commits_summary=$commits_summary" >> $GITHUB_OUTPUT

      - name: Discord notification
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"Deployment Status\",
                \"description\": \"Push contains ${{ steps.commit_info.outputs.push_count }} commits (Total commits in repo: ${{ steps.commit_info.outputs.total_commits }})\",
                \"color\": 3066993,
                \"fields\": [
                  {\"name\": \"Repository\", \"value\": \"${{ github.repository }}\", \"inline\": true},
                  {\"name\": \"Branch\", \"value\": \"${{ github.ref_name }}\", \"inline\": true},
                  {\"name\": \"Commits\", \"value\": \"${{ steps.commit_info.outputs.commits_summary }}\", \"inline\": false}
                ],
                \"footer\": {\"text\": \"Triggered by ${{ github.actor }}\"},
                \"timestamp\": \"${{ github.event.head_commit.timestamp }}\"
              }]
            }"
          curl -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "$payload"
